[target]
source_id = "508915489570374272"
name = "Gaia DR3 508915489570374272"

[stellar]
# Initial RSP seed. The fitting driver will vary these within adopted bounds.
#
# PROVISIONAL. L and Teff are NOT the values Brad supplied (4100 Lsun, 6200 K):
# those are inconsistent with P = 14.789 d, giving R = 55 Rsun and a fundamental
# period near 6 d, which is exactly what LINA returned. The values below are a
# self-consistent solution of the De Somma+2022 period-mass-luminosity-temperature
# relation at this period and [Fe/H], with Teff placed mid-strip:
#     logP = 10.513 - 3.255 logTeff - 0.772 logM + 0.919 logL + 0.046 [Fe/H]
# Starting point was M = 8.0, Teff = 5500 K -> logL = 3.83 (6700 Lsun).
#
# Iterated against MESA from there:
#   5500 K, 6700 Lsun -> LINA P0 = 14.118 d, growth = -7.8e-4  (damped, too hot)
#   5400 K, 6700 Lsun -> LINA P0 = 15.079 d, growth = +3.2e-3  (excited)
#                        nonlinear settled P = 15.133 d, DeltaR = 11.90 Rsun,
#                        DeltaMag = 0.478, converged in 87 periods / 11 min
#   nonlinear period runs 0.36% longer than linear for this model.
#
# Current values correct the 2.3% period excess by moving L at fixed M and Teff
# (rather than Teff, because 5500 K was already damped and going hotter returns
# to the blue edge). Set from a direct LINA scan rather than the scaling alone:
#
#   L      linear P0    growth
#   6450   14.566 d     2.80e-3
#   6510   14.688 d     2.87e-3
#   6530   BUILD FAILED  <- isolated envelope-builder failure, not physical
#   6560   14.787 d     2.93e-3
#   6700   15.079 d     3.23e-3
#
# Wanted linear P0 = 14.789/1.0036 = 14.736 d, interpolating to L = 6534. Both
# 6530 and 6540 fail to build, so the envelope builder has a bad interval inside
# (6510, 6560) rather than a single bad point, and the ideal value is inside it.
#
# 6560 adopted. It predicts a nonlinear period of 14.84 d, 0.34% high; 6510 would
# give 14.74 d, 0.33% low. Not worth resolving further -- the 1.0036 nonlinear
# offset was measured at L = 6700 and is not known to better than a few tenths
# of a percent itself, and both are far inside the uncertainty on the inputs.
#
# REPLACE with catalogue values once the Gaia DR3 query (vari_cepheid
# mode/period, FLAME L, Bailer-Jones distance, 3D-dust extinction) has been run.
mass_msun = 8.0
luminosity_lsun = 6535.3
teff_k = 5400.0
x = 0.7
# Z from [Fe/H] = +0.28 on the Asplund+09 scale used by kap_file_prefix = a09
# and initial_zfracs = 6: (Z/X)_sun = 0.0181, so Z/X = 0.0181 * 10^0.28 = 0.03449,
# giving Z = 0.0241 at X = 0.700 (Y = 0.2759).
z = 0.0241

[observations]
# Zero is allowed during initial setup. It is not passed to RSP as a fitted
# physical input; when set, it is used only to choose a sensible timestep cap.
period_days = 14.78917
distance_pc = 2989.9
feh = 0.28

[paths]
# Point this at an index file/directory containing Gaia Gbp, G, and Grp.
gaia_instrument = "auto"
stellar_atmosphere = "auto"
vega_sed = "auto"

[photometry]
magnitude_system = "Vega"
# MESA produces intrinsic absolute magnitudes. Distance/extinction are applied
# in the fitting likelihood without rerunning MESA.
model_distance_pc = 10.0
write_sed_csv = false
write_sed_per_model = false

[run]
settle_min_periods = 80
settle_stable_periods = 8
# Long-period Cepheids near the red edge need more cycles to reach the limit
# cycle than RR Lyrae do. The run terminates early on acceptance, so a high
# ceiling costs nothing for a good model.
settle_max_periods = 2000
grekm_tolerance = 1.0e-3
kick_km_s = 20.0
# 600 steps/cycle is the value used in the published RSP literature. 150 was an
# RR Lyrae carry-over and is coarse for a 15 d pulsator.
settle_steps_per_cycle = 600
colors_periods = 10
colors_steps_per_cycle = 500
# WAS 600.0, and that was the single biggest cost bug in the pipeline.
# RSP_max_dt overrides RSP_target_steps_per_cycle whenever it is smaller. At
# P = 0.5 d (RR Lyrae) 600 s never binds; at P = 15 d it forces ~14x more steps
# than requested. Set well above any dt this target needs (dt ~ 2100 s at
# P = 14.8 d and 600 steps/cycle) so it acts only as a runaway guard.
fallback_max_dt_seconds = 100000.0

# Added by Gaia RSP v4: mode screen and nonzero-amplitude settling.
target_mode = 0
minimum_linear_growth = 0.0
minimum_delta_r_rsun = 0.05
minimum_delta_mag = 0.01
amplitude_relative_tolerance = 0.02

# Convection / eddy viscosity. alfam is the parameter that sets the limit-cycle
# AMPLITUDE and is therefore the knob for matching the observed Gaia peak-to-peak
# amplitudes. MESA defaults (Smolec set A): alfa = 1.5, alfam = 0.25. Stated
# explicitly so it is a visible fit parameter rather than an implicit default.
rsp_alfa = 0.9
# Back to 0.25 for this test. At 0.20 the RELAX_ENV relaxation diverged when
# turbulent pressure was switched on -- eddy viscosity is the damping that keeps
# the envelope relaxation stable, so alfap and alfam cannot be lowered together.
rsp_alfam = 0.26

# Convection set (Smolec & Moskalik 2008; Paxton+2019 Table 4). Set A is the
# simplest and is what produced the too-sinusoidal light curve: no radiative
# cooling, no turbulent pressure, no turbulent flux.
#   A: gammar=0, alfap=0,     alfat=0
#   B: gammar=1, alfap=0,     alfat=0      (adds radiative cooling)
#   C: gammar=0, alfap=0.667, alfat=0.01   (adds turbulent pressure + flux)
#   D: gammar=1, alfap=0.667, alfat=0.01   (all effects)
rsp_gammar = 0.0
# Reduced turbulent pressure, NOT the canonical set C value of 0.667. A LINA
# scan at fixed L and Teff gave mode-0 growth of +3.06e-3 at alfap = 0.05,
# +2.60e-3 at 0.20, +5.75e-4 at 0.40 and -1.98e-3 at 0.667: full turbulent
# pressure puts this model outside the instability strip entirely, with growth
# crossing zero near alfap = 0.43. 0.20 keeps healthy growth while still adding
# the term, and tests whether turbulent pressure moves the light-curve
# asymmetry at all. State this as reduced-alfap, not as set C.
rsp_alfap = 0.0
rsp_alfat = 0.0

# Relative cumulative energy error above which a settled model is rejected.
#
# WAS 1.0e-4, which was a guess made before any long-period Cepheid had been
# run here, and it rejected a properly converged model: 87 periods, GREKM
# 2.4e-4, amplitude drifting by 1 part in 1e4, but rel_run_E_err = -2.8e-4.
# That is accumulation over 68000 steps and 1334 days of integration with the
# surface going supersonic (max vsurf/cs = 3.19), which is ordinary for a
# large-amplitude Cepheid rather than a sign of a bad integration. 1.0e-3 still
# catches a genuinely broken run while allowing this class of model through.
max_rel_run_energy_error = 1.0e-3

[search]
# Coarse LINA basin search. Initial version varies M, L, and Teff only.
mass_min = 6.0
mass_max = 10.0
mass_points = 5

luminosity_min = 3000.0
luminosity_max = 8000.0
luminosity_points = 9

teff_min = 5000.0
teff_max = 6500.0
teff_points = 11

# Parallel LINA grid. Total CPU use is roughly workers * threads_per_run.
workers = 4
threads_per_run = 3

# LINA objective / simplex.
growth_margin = 0.0
growth_scale = 0.01
growth_penalty_weight = 1.0
damped_base_penalty = 1.0
crash_penalty = 1000000.0
lina_timeout_seconds = 180.0
simplex_starts = 3
simplex_maxiter = 80
simplex_step_fraction = 0.06
simplex_xatol = 0.002
simplex_fatol = 1.0e-6

# Expensive stage: only the best LINA candidates reach nonlinear RSP + Colors.
nonlinear_keep = 5
nonlinear_workers = 1
nonlinear_timeout_seconds = 14400.0

[fit]
# Long-format Gaia epoch photometry: time,band,mag,mag_err.
# A phase column may be used instead of time.
observations_file = "observations/gaia_epoch_photometry.csv"

# Use the catalogue distance from [observations] when <= 0.
distance_pc = 0.0

# Extinction is applied in the likelihood, not inside MESA. Put the adopted
# band extinctions here before the final photometric fit.
extinction_G = 1.1271
extinction_Gbp = 1.4313
extinction_Grp = 0.8414

# Stable multi-cycle model curve; never cherry-pick a single cycle.
model_cycles = 5
model_phase_bins = 300
phase_grid_points = 720
photometric_sigma_mag = 0.03
period_sigma_fraction = 0.005

# Full nonlinear Nelder-Mead. Expensive; run explicitly with `fit` by default.
simplex_maxiter = 30
simplex_step_fraction = 0.03
simplex_xatol = 0.001
simplex_fatol = 0.001
run_full_simplex_in_all = false

